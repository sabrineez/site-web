<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROanalyse</title>

<link rel="stylesheet" href="style.css">

<!-- SSL FIX -->
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

<script>
if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  location.href = 'https://' + location.hostname + location.pathname;
}
</script>

</head>
<body>

<nav class="menu">
  <button onclick="showPanel('intro')">Introduction</button>
  <button onclick="showPanel('classification')">Classification</button>
  <button onclick="showPanel('risque')">Analyse de risque</button>
  <button onclick="showPanel('dashboard')">Suivi des demandes</button>
</nav>

<!-- INTRO -->
<section id="intro" class="panel active">
  <h1>Bienvenue sur PROanalyse</h1>
</section>

<!-- CLASSIFICATION -->
<section id="classification" class="panel">
  <h2>Classification</h2>

  <input id="nom_objet" placeholder="Nom du projet">
  <input id="responsable" placeholder="Responsable">

  <button onclick="submitClassification()">Terminer</button>
</section>

<!-- RISQUE -->
<section id="risque" class="panel">
  <h2>Analyse de risque</h2>

  <input id="actifs_principaux" placeholder="Actifs principaux">

  <button onclick="submitRisque()">Terminer</button>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="panel">
  <h2>Suivi des demandes</h2>

  <div class="kpi">
    <div>Total : <span id="kpiTotal">0</span></div>
    <div>Classification : <span id="kpiClassification">0</span></div>
    <div>Risque : <span id="kpiRisque">0</span></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Type</th>
        <th>Projet</th>
        <th>Responsable</th>
        <th>Date</th>
      </tr>
    </thead>

    <tbody id="dashboardBody"></tbody>
  </table>
</section>

<script src="script.js"></script>

</body>
</html>
